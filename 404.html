<style>
:root{
  color-scheme:dark;
  --ground:#0D0F13; --surface:#14171D; --raise:#1B1F27; --ink:#EEEFF2; --muted:#9AA1AD; --faint:#646B78; --rule:#252A34;
  --gold:#EBB64E; --gold-text:#EBB64E; --on-gold:#17120A; --live:#5BC48A; --lab:#8E9BFF;
  --shadow:0 24px 60px -30px rgba(0,0,0,.8);
  --display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --ground:#F4F4F1; --surface:#FFFFFF; --raise:#EFEEE9; --ink:#14161B; --muted:#545B67; --faint:#8A909B; --rule:#DDDCD5;
    --gold:#EBB64E; --gold-text:#9A6B08; --on-gold:#17120A; --live:#1E8A50; --lab:#4B57C8;
    --shadow:0 24px 50px -32px rgba(20,22,27,.35);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --ground:#F4F4F1; --surface:#FFFFFF; --raise:#EFEEE9; --ink:#14161B; --muted:#545B67; --faint:#8A909B; --rule:#DDDCD5;
  --gold:#EBB64E; --gold-text:#9A6B08; --on-gold:#17120A; --live:#1E8A50; --lab:#4B57C8;
  --shadow:0 24px 50px -32px rgba(20,22,27,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.6;padding:0 24px;-webkit-font-smoothing:antialiased}
.shell{max-width:1140px;margin:0 auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}

/* wordmark */
.wm{font-family:var(--display);font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.wm .x{color:var(--gold-text)}

/* header */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);margin:0 -24px;padding:0 24px}
header.bar .shell{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
header.bar .wm{font-size:19px;text-decoration:none}
header.bar nav{display:flex;gap:26px;font-size:14.5px}
header.bar nav a{text-decoration:none;color:var(--muted)}
header.bar nav a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--body);font-weight:600;font-size:15px;text-decoration:none;border-radius:8px;padding:11px 18px;border:1px solid transparent;cursor:pointer;transition:transform .15s ease,background .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--gold);color:var(--on-gold)}
.btn.ghost{border-color:var(--rule);color:var(--ink);background:transparent}
.btn.ghost:hover{background:var(--raise)}
header.bar .btn{padding:8px 14px;font-size:14px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:56px;align-items:center;padding-block:88px 72px}
.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.eyebrow b{color:var(--gold-text);font-weight:500}
h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,6.2vw,72px);line-height:1.02;letter-spacing:-.035em;margin:18px 0 22px;text-wrap:balance}
h1 .br{color:var(--gold-text);font-weight:500}
.hero p.lede{font-size:19px;color:var(--muted);max-width:52ch;margin:0 0 30px}
.cta{display:flex;flex-wrap:wrap;gap:12px}

.index{background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.index .head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.04em}
.index ol{list-style:none;margin:0;padding:6px 0}
.index li a,.index li .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;text-decoration:none}
.index li a:hover{background:var(--raise)}
.index .nm{font-family:var(--display);font-weight:600;font-size:17px}
.index .cat{display:block;font-size:13px;color:var(--muted);font-family:var(--body);font-weight:400}
.status{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--muted)}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px color-mix(in srgb,var(--live) 22%,transparent)}
.status.lab::before{background:var(--lab);box-shadow:0 0 0 3px color-mix(in srgb,var(--lab) 22%,transparent)}
.index .foot{padding:12px 18px;border-top:1px solid var(--rule);font-size:13px;color:var(--faint)}

/* sections */
section.block{padding-block:72px;border-top:1px solid var(--rule)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px;margin-bottom:36px}
h2{font-family:var(--display);font-weight:700;font-size:clamp(30px,4vw,42px);letter-spacing:-.025em;line-height:1.1;margin:10px 0 0;text-wrap:balance}
.sec-head p{color:var(--muted);max-width:46ch;margin:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:12.5px;padding:7px 13px;border-radius:999px;border:1px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}

.work{display:grid;gap:28px}
.proj{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:44px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:28px}
.proj:nth-child(even) .shot{order:2}
.shot{display:block;border-radius:10px;overflow:hidden;border:1px solid var(--rule);background:var(--raise);text-decoration:none;box-shadow:var(--shadow);transition:transform .25s ease}
.shot:hover{transform:translateY(-3px)}
.shot .chrome{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--rule);background:var(--raise)}
.shot .chrome i{width:9px;height:9px;border-radius:50%;background:var(--rule);display:block}
.shot .chrome span{margin-left:10px;font-family:var(--mono);font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shot img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.proj .tag{font-family:var(--mono);font-size:12px;color:var(--gold-text);letter-spacing:.04em}
.proj h3{font-family:var(--display);font-weight:700;font-size:32px;letter-spacing:-.02em;margin:8px 0 6px;line-height:1.1}
.proj .one{font-size:18px;color:var(--ink);margin:0 0 14px;font-weight:500}
.proj p{color:var(--muted);margin:0 0 16px;max-width:52ch}
.proj ul{margin:0 0 20px;padding:0;list-style:none;display:grid;gap:7px}
.proj li{padding-left:22px;position:relative;font-size:15.5px}
.proj li::before{content:"";position:absolute;left:3px;top:.62em;width:9px;height:1.5px;background:var(--gold)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.facts span{font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px solid var(--rule);padding:4px 9px;border-radius:6px}
.open{display:inline-flex;align-items:center;gap:8px;font-weight:600;text-decoration:none;color:var(--ink);border-bottom:1.5px solid var(--gold);padding-bottom:2px}
.open:hover{color:var(--gold-text)}

/* lab */
.lab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.lab-card{border:1px dashed var(--rule);border-radius:14px;padding:26px;background:transparent}
.lab-card .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.lab-card h3{font-family:var(--display);font-size:24px;font-weight:700;margin:0;letter-spacing:-.015em}
.lab-card p{color:var(--muted);margin:0 0 14px}
.lab-card .stack{font-family:var(--mono);font-size:12px;color:var(--faint)}

/* principles */
.prin{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.prin div{padding:26px 22px;border-right:1px solid var(--rule);background:var(--surface)}
.prin div:last-child{border-right:0}
.prin .k{font-family:var(--mono);font-size:12px;color:var(--gold-text);letter-spacing:.04em}
.prin h4{font-family:var(--display);font-size:19px;font-weight:600;margin:10px 0 8px;letter-spacing:-.01em}
.prin p{color:var(--muted);font-size:15px;margin:0}

/* about/contact */
.about{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:start}
.about p{color:var(--muted);max-width:58ch;font-size:17.5px}
.about p strong{color:var(--ink);font-weight:600}
.contact{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:26px}
.contact h3{font-family:var(--display);font-size:24px;margin:0 0 6px;font-weight:700}
.contact p{color:var(--muted);font-size:15.5px;margin:0 0 18px}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--rule)}
.line .lbl{font-family:var(--mono);font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;display:block}
.line .val{font-weight:600;word-break:break-all;user-select:all}
.copy{font-family:var(--mono);font-size:12px;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.copy:hover{background:var(--raise)}

footer.foot{border-top:1px solid var(--rule);padding-block:28px 40px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;color:var(--faint);font-size:13.5px}
footer.foot .wm{color:var(--ink);font-size:16px}

@media (max-width:920px){
  .hero{grid-template-columns:minmax(0,1fr);gap:40px;padding-block:56px 48px}
  .proj{grid-template-columns:minmax(0,1fr);gap:24px;padding:20px}
  .proj:nth-child(even) .shot{order:0}
  .prin{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prin div:nth-child(2){border-right:0}
  .prin div:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .about{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  body{padding:0 16px}
  header.bar{margin:0 -16px;padding:0 16px}
  header.bar nav{display:none}
  .lab-grid{grid-template-columns:minmax(0,1fr)}
  .prin{grid-template-columns:minmax(0,1fr)}
  .prin div{border-right:0;border-bottom:1px solid var(--rule)}
  .prin div:last-child{border-bottom:0}
  .proj h3{font-size:27px}
  section.block{padding-block:56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
